<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Home</a>
            <a href="#">Shop <i class="fas fa-chevron-down"></i></a>
            <a href="#">New Arrivals</a>
            <a href="#">Brand</a>
        </div>
        <div class="user-icon">
            <i class="fas fa-user"></i> <i class="fas fa-chevron-down"></i>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>Account Settings</h1>
            <p class="subtitle">Masukkan profil dan edit profil anda supaya lebih keren</p>
        </header>

        <form action="/account/settings" method="POST">
            
            <div class="section-title">Informasi profil</div>
            <div class="form-row">
                <div class="form-group">
                    <label>Nama Depan</label>
                    <input type="text" name="first_name" value="{{ user.first_name }}">
                </div>
                <div class="form-group">
                    <label>Last name</label> <input type="text" name="last_name" value="{{ user.last_name }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" value="{{ user.email }}">
                </div>
                <div class="form-group">
                    <label>Nomor Hp</label>
                    <div class="input-icon-wrapper">
                        <span class="flag-icon">ID</span>
                        <input type="text" name="phone" value="{{ user.phone }}" class="input-with-icon">
                    </div>
                </div>
            </div>

            <div class="section-title mt-large">Change Password</div>
            <div class="form-row">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="new_password" placeholder="******************">
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" name="confirm_password" placeholder="******************">
                </div>
            </div>

            <div class="section-title mt-large">Address</div>
            <div class="form-group">
                <label>Shipping address</label>
                <textarea name="address" rows="3">{{ user.address }}</textarea>
            </div>
            <button type="submit" class="save-btn">Save Changes</button>
        </form>
    </div>
</body>
</html>
